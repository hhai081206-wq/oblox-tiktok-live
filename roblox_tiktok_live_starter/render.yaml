services:
  - type: web
    name: roblox-tiktok-live
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    envVars:
      - key: TIKTOK_USERNAME
        sync: false
      - key: BRIDGE_KEY
        sync: false
